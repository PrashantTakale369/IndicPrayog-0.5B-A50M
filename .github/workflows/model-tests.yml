name: Model architecture

on:
  push:
    paths: ["model/**", "tests/**", "requirements-model.txt", "ruff.toml", ".github/workflows/model-tests.yml"]
  pull_request:
    paths: ["model/**", "tests/**", "requirements-model.txt", "ruff.toml", ".github/workflows/model-tests.yml"]

permissions:
  contents: read

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-model.txt --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install ruff==0.17.0
      - run: ruff check model tests
      - run: ruff format --check model tests
      - run: python -m unittest discover -s tests -v
      - run: python -m model.smoke_test
